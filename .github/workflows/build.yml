name: Build Craftgram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find or install Android SDK
        run: |
          set -e
          SDK=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              SDK="$d"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "No SDK found, installing cmdline-tools..."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          echo "Using SDK at: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, gradle will handle SDK components itself"
          fi

          echo "sdk.dir=$SDK" >> "$GITHUB_WORKSPACE/local.properties"

      - name: Write API keys
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "ERROR: secrets APP_ID / APP_HASH are missing!"
            exit 1
          fi
          echo "TELEGRAM_APP_ID=$APP_ID" >> gradle.properties
          echo "TELEGRAM_APP_HASH=$APP_HASH" >> gradle.properties
          echo "APP_ID=$APP_ID" >> local.properties
          echo "APP_HASH=$APP_HASH" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace assembleAfatDebug || ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Craftgram-APK
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          
