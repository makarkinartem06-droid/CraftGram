name: Build CraftGram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверка секретов
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "СЕКРЕТЫ APP_ID / APP_HASH ПУСТЫЕ. Добавь их: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Секреты на месте, APP_ID длиной ${#APP_ID} символов, APP_HASH длиной ${#APP_HASH} символов"

      - name: Ключи в local.properties
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
        run: |
          MAPS_KEY="$MAPS_V2_API"
          if [ -z "$MAPS_KEY" ]; then
            MAPS_KEY="stub_maps_key_replace_me"
            echo "MAPS_V2_API не задан, ставлю заглушку (карта в приложении работать не будет, сборке не мешает)"
          fi
          for TARGET in "local.properties" "TMessagesProj/local.properties"; do
            {
              echo "sdk.dir=$ANDROID_HOME"
              echo "APP_ID=$APP_ID"
              echo "APP_HASH=$APP_HASH"
              echo "MAPS_V2_API=$MAPS_KEY"
            } > "$TARGET"
            echo "Записал $TARGET:"
            grep -v "APP_HASH\|MAPS_V2_API" "$TARGET"
          done

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon 2>&1 | tee gradle.log

      - name: Показать причину падения
        if: failure()
        run: |
          echo "=== ЧТО СЛОМАЛОСЬ ==="
          grep -n -A 4 "What went wrong" gradle.log | head -40 || true
          echo "=== Caused by ==="
          grep -n -A 3 "Caused by" gradle.log | head -40 || true

      - name: Собрать apk
        run: |
          rm -rf apk
          mkdir -p apk
          find . -name "*.apk" -not -path "./apk/*" -exec cp {} apk/ \;
          ls -la apk
          if [ -z "$(ls -A apk)" ]; then
            echo "APK НЕ СОБРАЛСЯ"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Show log tail
        if: failure()
        run: |
          echo "=== ПОСЛЕДНИЕ 150 СТРОК ЛОГА GRADLE ==="
          if [ -f gradle.log ]; then
            tail -n 150 gradle.log
          else
            echo "gradle.log не найден"
          fi
          
