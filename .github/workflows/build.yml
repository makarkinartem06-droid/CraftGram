name: Build Craftgram

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout с сабмодулями
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Android SDK уже есть на раннере - проверяем
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Готовим gradlew и память
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "--- хвост gradle.properties ---"
          tail -n 8 gradle.properties

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon 2>&1 | tee gradle.log

      - name: Если таск не нашёлся - показать реальные имена
        if: failure()
        run: |
          if grep -qi "not found in project\|not found in root project\|Task 'assembleAfatDebug' not found" gradle.log 2>/dev/null; then
            echo "=== ТАКОГО ТАСКА НЕТ, ВОТ РЕАЛЬНЫЙ СПИСОК ==="
            ./gradlew :TMessagesProj_App:tasks --all --no-daemon 2>&1 | grep -Ei "assemble|bundle" || echo "список пуст"
            echo "=== И В ГЛАВНОМ ПРОЕКТЕ ==="
            ./gradlew tasks --all --no-daemon 2>&1 | grep -Ei "assemble|bundle" || true
          else
            echo "таск существует, причина падения другая - смотри хвост лога ниже"
          fi

      - name: Хвост лога на экран
        if: always()
        run: |
          echo "=== ПОСЛЕДНИЕ 150 СТРОК ЛОГА GRADLE ==="
          tail -n 150 gradle.log 2>/dev/null || echo "gradle.log не найден"
          echo
          echo "=== ЧТО НАШЛОСЬ ИЗ APK ==="
          find . -path "*/outputs/apk/*" -name "*.apk" 2>/dev/null || echo "apk нет"

      - name: Собрать apk в одну папку
        if: always()
        run: |
          rm -rf apk
          mkdir -p apk
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp -v {} apk/ \; 2>/dev/null || true
          ls -la apk
          if [ -z "$(ls -A apk 2>/dev/null)" ]; then
            echo "APK НЕ СОБРАЛСЯ"
            exit 1
          fi
          echo "APK ЕСТЬ, ВСЁ ХОРОШО"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Лог gradle артефактом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn
          retention-days: 14
          
