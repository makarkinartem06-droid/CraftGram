name: Build Craftgram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME не найден, ставим SDK вручную"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            export ANDROID_HOME="$HOME/android-sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Проверка секретов
        run: |
          if [ -z "${{ secrets.APP_ID }}" ] || [ -z "${{ secrets.APP_HASH }}" ]; then
            echo "ОШИБКА: не заданы секреты APP_ID и APP_HASH"
            exit 1
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --stacktrace 2>&1 | tee gradle.log
          echo "=== ЧТО СЛОМАЛОСЬ ==="
          grep -A 10 "What went wrong:" gradle.log || echo "(строки What went wrong не найдено)"
          echo "=== CAUSED BY ==="
          grep -B 2 -A 10 "Caused by" gradle.log || echo "(Caused by не найдено)"
          echo "=== ХВОСТ ЛОГА ==="
          tail -n 30 gradle.log

      - name: Причина падения в артефакт
        if: failure()
        run: |
          {
            echo "== ЧТО СЛОМАЛОСЬ ==="
            grep -A 10 "What went wrong:" gradle.log || echo "(не найдено)"
            echo ""
            echo "=== CAUSED BY ==="
            grep -B 2 -A 10 "Caused by" gradle.log || echo "(не найдено)"
            echo ""
            echo "=== ХВОСТ ЛОГА ==="
            tail -n 30 gradle.log
          } > prichina-padeniya.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-APK
          path: TMessagesProj/build/outputs/apk/**/release/*.apk

      - name: Upload причины падения
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prichina-padeniya
          path: prichina-padeniya.txt
          
