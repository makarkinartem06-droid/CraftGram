name: Build CraftGram

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;21.4.7075529" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Write API keys
        run: |
          printf 'APP_ID=%s\nAPP_HASH=%s\nTELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n' "${{ secrets.APP_ID }}" "${{ secrets.APP_HASH }}" "${{ secrets.APP_ID }}" "${{ secrets.APP_HASH }}" >> local.properties
          printf 'APP_ID=%s\nAPP_HASH=%s\nTELEGRAM_APP_ID=%s\nTELEGRAM_APP_HASH=%s\n' "${{ secrets.APP_ID }}" "${{ secrets.APP_HASH }}" "${{ secrets.APP_ID }}" "${{ secrets.APP_HASH }}" >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace || ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
