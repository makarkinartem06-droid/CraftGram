name: Build CraftGram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Check secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::error::Секреты APP_ID / APP_HASH не заданы в Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Write local.properties
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          printf 'sdk.dir=%s\nAPP_ID=%s\nAPP_HASH=%s\n' "$ANDROID_HOME" "$APP_ID" "$APP_HASH" > local.properties
          if [ -d TMessagesProj ]; then
            cp local.properties TMessagesProj/local.properties || true
          fi

      - name: Build APK
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon 2>&1 | tee gradle.log
          STATUS=${PIPESTATUS[0]}
          echo "=== GRADLE EXIT CODE: $STATUS ==="
          if [ "$STATUS" != "0" ]; then
            echo "=== ЕСЛИ ВЫШЕ Task not found, ВОТ СПИСОК РЕАЛЬНЫХ ТАСОК СБОРКИ ==="
            ./gradlew tasks --all --no-daemon 2>/dev/null | grep -i assemble | head -60 || true
            exit 1
          fi

      - name: Show log tail (always)
        if: always()
        run: |
          echo "=== ПОСЛЕДНИЕ 80 СТРОК ЛОГА GRADLE ==="
          tail -n 80 gradle.log || echo "gradle.log не найден"
          echo "=== ЧТО НАШЛОСЬ ИЗ APK ==="
          find . -name "*.apk" -not -path "*/\.*" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

      - name: Save failure reason
        if: failure()
        run: |
          {
            echo "=== ЧТО СЛОМАЛОСЬ ==="
            grep -A 15 "What went wrong" gradle.log || true
            echo ""
            echo "=== CAUSED BY ==="
            grep -B 2 -A 8 "Caused by" gradle.log | head -80 || true
            echo ""
            echo "=== ХВОСТ ЛОГА ==="
            tail -n 60 gradle.log || true
          } > prichina-padeniya.txt

      - name: Upload failure reason
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prichina-padeniya
          path: prichina-padeniya.txt
          
