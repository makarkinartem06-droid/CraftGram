name: Build Craftgram

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find Android SDK and Install NDK/CMake
        run: |
          # Try to find sdkmanager in common SDK locations
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then
              SDK_ROOT="$HOME/Android/Sdk"
          fi
          if [ ! -d "$SDK_ROOT" ]; then
              SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [ ! -d "$SDK_ROOT" ]; then
              echo "Error: Android SDK not found in common locations."
              exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" --sdk_root=$SDK_ROOT

      - name: Write API keys
        run: |
          echo "API_ID = ${{ secrets.APP_ID }}" > ./gradle.properties
          echo "API_HASH = \"${{ secrets.APP_HASH }}\"" >> ./gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Craftgram.apk
          path: app/build/outputs/apk/release/app-release.apk


