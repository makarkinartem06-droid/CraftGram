name: Build Craftgram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Проверить секреты
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "СЕКРЕТЫ ПУСТЫЕ! Добавь APP_ID и APP_HASH в Settings - Secrets and variables - Actions"
            exit 1
          fi
          echo "секреты на месте, длина APP_ID: ${#APP_ID}, длина APP_HASH: ${#APP_HASH}"

      - name: Прописать ключи в gradle и local.properties
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          for f in local.properties gradle.properties; do
            touch "$f"
            {
              echo "TELEGRAM_APP_ID=$APP_ID"
              echo "TELEGRAM_APP_HASH=$APP_HASH"
              echo "APP_ID=$APP_ID"
              echo "APP_HASH=$APP_HASH"
            } >> "$f"
          done
          if [ -d TMessagesProj ]; then
            touch TMessagesProj/gradle.properties
            {
              echo "TELEGRAM_APP_ID=$APP_ID"
              echo "TELEGRAM_APP_HASH=$APP_HASH"
              echo "APP_ID=$APP_ID"
              echo "APP_HASH=$APP_HASH"
            } >> TMessagesProj/gradle.properties
          fi
          echo "ключи прописаны"

      - name: Build APK
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace \
            -PTELEGRAM_APP_ID="$APP_ID" -PTELEGRAM_APP_HASH="$APP_HASH" \
            -PAPP_ID="$APP_ID" -PAPP_HASH="$APP_HASH" \
            2>&1 | tee gradle.log

      - name: Показать причину падения
        if: failure()
        run: |
          echo "=== ЧТО СЛОМАЛОСЬ ==="
          if [ -f gradle.log ]; then
            grep -n -A 6 "What went wrong" gradle.log | head -n 40 || true
            echo "=== Caused by ==="
            grep -n -m 3 -A 3 "Caused by" gradle.log | head -n 30 || true
            echo "=== ПОСЛЕДНИЕ 60 СТРОК ==="
            tail -n 60 gradle.log
          else
            echo "gradle.log нет - сборка не дошла до gradle"
          fi

      - name: Собрать apk в одну папку
        run: |
          rm -rf apk
          mkdir -p apk
          find . -name "*.apk" -path "*build/outputs*" -exec cp {} apk/ \;
          ls -la apk/
          if [ -z "$(ls -A apk)" ]; then
            echo "APK НЕ СОБРАЛСЯ"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftGram-apk
          path: apk/*.apk
          if-no-files-found: error
          
